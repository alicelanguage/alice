  <rect x="10" y="10" width="480" height="680" rx="40" fill="#F5EFE0" stroke="#141210" stroke-width="10"/>
  <rect x="44" y="44" width="412" height="612" rx="18" fill="none" stroke="#C2183C" stroke-width="3"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#141210">
    <text x="40" y="104" font-size="64">A</text>
    <text transform="translate(460 596) rotate(180)" font-size="64">A</text>
  </g>
  <polygon points="62,124 76,142 62,160 48,142" fill="#C2183C"/>
  <polygon points="438,576 452,558 438,540 424,558" fill="#C2183C"/>
  <g transform="translate(250 360) scale(.78) translate(-256 -256)">
  <g transform="translate(-50 26)">
    <!-- straight ear: a lancet blade with a cherry core -->
    <polygon points="198,262 206,76 238,40 254,250" fill="#F5EFE0" stroke="#141210" stroke-width="12" stroke-linejoin="miter"/>
    <polygon points="216,226 220,98 234,82 240,230" fill="#C2183C"/>
    <!-- bent ear: rises, then folds into a question mark -->
    <polyline points="292,252 300,150 324,100 368,84 408,104 418,146 398,178 368,192 364,212" fill="none" stroke="#141210" stroke-width="54" stroke-linejoin="miter" stroke-miterlimit="8"/>
    <polyline points="292,252 300,150 324,100 368,84 408,104 418,146 398,178 368,192 364,206" fill="none" stroke="#F5EFE0" stroke-width="32" stroke-linejoin="miter" stroke-miterlimit="8"/>
    <!-- the question mark's dot -->
    <polygon points="364,232 386,260 364,288 342,260" fill="#C2183C" stroke="#141210" stroke-width="8" stroke-linejoin="miter"/>
    <!-- head: faceted like a card pip -->
    <polygon points="168,312 196,254 256,232 318,250 344,312 320,382 256,420 192,382" fill="#F5EFE0" stroke="#141210" stroke-width="12" stroke-linejoin="miter"/>
    <!-- eyes: a tall diamond, and a spiral into another world -->
    <polygon points="222,280 235,304 222,332 209,304" fill="#141210"/>
    <path d="M290 306 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0 a12 12 0 1 1 24 0 a16 16 0 1 1 -32 0" fill="none" stroke="#C2183C" stroke-width="5" stroke-linecap="round"/>
    <!-- nose and a sly, lopsided smirk -->
    <polygon points="249,346 265,346 257,359" fill="#C2183C"/>
    <polyline points="232,376 262,380 288,358" fill="none" stroke="#141210" stroke-width="7" stroke-linejoin="miter"/>
    <polygon points="282,357 293,352 289,364" fill="#141210"/>
  </g>
  </g>
</svg>
