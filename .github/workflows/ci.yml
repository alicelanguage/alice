name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_UI_LANGUAGE: en-US
  ALICE_LANG: en

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Alice.sln
      - name: Build
        run: dotnet build Alice.sln --configuration Release --no-restore
      - name: Test full suite (including allocation and integration tests)
        run: dotnet test Alice.sln --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Verify examples and ASP.NET HTTP routes
        shell: bash
        run: ALICE_DLL="$PWD/src/Alice.Cli/bin/Release/net10.0/alice.dll" bash examples/verify.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
