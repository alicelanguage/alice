name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip the full test stage (package smoke checks still run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_UI_LANGUAGE: en-US

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate version and release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = & ./.github/scripts/release-version.ps1 -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT

  test:
    if: >-
      ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) &&
          !(github.event_name == 'push' && vars.RELEASE_SKIP_TESTS == 'true') }}
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.rid }})
    needs: [version, test]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
          (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Publish, archive, extract and smoke test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_RID: ${{ matrix.rid }}
        run: ./.github/scripts/package.ps1 -Runtime $env:RELEASE_RID -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alice-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' &&
          needs.version.result == 'success' && needs.package.result == 'success' &&
          (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [version, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: alice-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip ./*.sha256 \
            --verify-tag --title "Alice $RELEASE_TAG" --generate-notes
