name: Release

on:
  push:
    tags: ['v*']
  schedule:
    # Nightly build of main at 03:17 UTC (skipped when main has not moved since the last nightly).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (stable publishes vX.Y.Z; nightly replaces the rolling `nightly` prerelease)
        type: choice
        options: [stable, nightly]
        default: stable
      skip_tests:
        description: Skip the full test stage (package smoke checks still run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_UI_LANGUAGE: en-US

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate version and release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel || 'stable' }}
        run: |
          $channel = $env:RELEASE_CHANNEL
          $version = & ./.github/scripts/release-version.ps1 -Tag $env:RELEASE_TAG -Channel $channel
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$(if ($channel -eq 'nightly') { 'nightly' } else { "v$version" })" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
      - name: Skip unchanged scheduled nightlies
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          changed=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
            [ "$last" = "${{ github.sha }}" ] && changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "nightly up to date: $([ $changed = false ] && echo yes || echo no)"

  test:
    if: >-
      ${{ needs.version.outputs.changed == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) &&
          !(github.event_name == 'push' && vars.RELEASE_SKIP_TESTS == 'true') }}
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.rid }})
    needs: [version, test]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.changed == 'true' &&
          (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Publish, archive, extract and smoke test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_RID: ${{ matrix.rid }}
        run: ./.github/scripts/package.ps1 -Runtime $env:RELEASE_RID -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alice-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'tag')) &&
          needs.version.result == 'success' && needs.version.outputs.changed == 'true' && needs.package.result == 'success' &&
          (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [version, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: alice-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          # release notes: this version's CHANGELOG section
          awk -v v="$RELEASE_VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\nArchives built from %s. Build and package checks: %s\n' "$RELEASE_COMMIT" "$RELEASE_RUN_URL" >> notes.md
          cd dist
          sha256sum --check *.sha256
          if [ "$RELEASE_CHANNEL" = "nightly" ]; then
            # one rolling prerelease: replace the previous nightly's assets and move its tag
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly ./*.tar.gz ./*.zip ./*.sha256 ./install.sh ./install.ps1 \
              --target "$RELEASE_COMMIT" --prerelease --title "Alice nightly $RELEASE_VERSION" \
              --notes "Nightly $RELEASE_VERSION built from $RELEASE_COMMIT. Not for production. Install: \`alice toolchain install nightly\`. Build: $RELEASE_RUN_URL"
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip ./*.sha256 ./install.sh ./install.ps1 \
              --target "$RELEASE_COMMIT" --title "Alice $RELEASE_TAG" --latest --notes-file ../notes.md
          fi

  nuget:
    name: Publish NuGet packages
    # ADR 0020: Alice.Sdk (MSBuild SDK), Alice.Cli (dotnet tool), Alice.Runtime; stable releases only
    # disabled for now: releases ship through the install scripts (scripts/install.sh, install.ps1)
    if: ${{ false }}
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Pack and push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for p in src/Alice.Runtime src/Alice.Sdk src/Alice.Cli; do dotnet pack "$p" -c Release -o nupkgs; done
          if [ -z "$NUGET_API_KEY" ]; then echo "::warning::NUGET_API_KEY is not set; packages built but not pushed"; exit 0; fi
          dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
